<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | Mamlo Foods</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body class="bg-[#FFF8F2] min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8 mt-8">
        <h2 class="text-2xl font-bold text-center mb-6 text-[#CA2E0A]">Login to Your Account</h2>
        <form method="post" autocomplete="off">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    placeholder="you@example.com">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    placeholder="Enter your password">
            </div>
            <button type="submit"
                class="w-full bg-[#CA2E0A] text-white font-bold py-2 rounded-lg hover:bg-[#a82307] transition mb-4">Login</button>
        </form>
        <div class="text-center text-sm text-gray-600">
            Don't have an account?
            <a href="/register/" class="text-[#CA2E0A] font-bold hover:underline">Register</a>
        </div>
    </div>
</body>

</html>
