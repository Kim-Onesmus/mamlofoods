{% extends 'ecom_base.html' %}
{% load static %}

{% block content %}
<main class="container mx-auto px-4 py-4">
    <div class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8 mt-8">
        <h2 class="text-2xl font-bold text-center mb-6 text-[#CA2E0A]">Create Your Account</h2>
        <div id="register-modal" style="display:none;"
            class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40">
            <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-[#CA2E0A]">Register</h2>
                    <button id="register-modal-close"
                        class="text-gray-400 hover:text-gray-700 text-2xl">&times;</button>
                </div>
                <p id="register-modal-msg" class="mb-6 text-gray-700"></p>
                <div class="flex justify-end">
                    <button id="register-modal-close2"
                        class="px-4 py-2 rounded bg-[#CA2E0A] text-white font-bold">Close</button>
                </div>
            </div>
        </div>
        <form id="register-form" autocomplete="off">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    placeholder="you@example.com">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    placeholder="Enter your password">
            </div>
            <div class="mb-6">
                <label for="confirm_password" class="block text-gray-700 font-semibold mb-2">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    placeholder="Re-enter your password">
            </div>
            <button id="register-btn" type="submit"
                class="w-full bg-[#CA2E0A] text-white font-bold py-2 rounded-lg hover:bg-[#a82307] transition mb-4">Register</button>
        </form>
        <div class="text-center text-sm text-gray-600">
            Already have an account?
            <a href="{% url 'login_page' %}" class="text-[#CA2E0A] font-bold hover:underline">Login</a>
        </div>
    </div>
</main>
{% endblock content %}
