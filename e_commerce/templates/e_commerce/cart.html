{% extends 'ecom_base.html' %}
{% load static %}

{% block content %}
<main class="container mx-auto px-4 py-4">
    <!-- Breadcrumb Card -->
    <div class="bg-white rounded-xl shadow p-4 mb-8">
        <nav class="flex items-center text-gray-600 text-sm" aria-label="Breadcrumb">
            <a href="/" class="hover:text-[#CA2E0A] font-semibold">Home</a>
            <span class="mx-2">/</span>
            <span class="text-[#CA2E0A] font-bold">Shopping Cart</span>
        </nav>
    </div>
    <div class="overflow-x-auto bg-white rounded-2xl shadow-lg p-4 md:p-8 mb-8">
        <table class="min-w-full divide-y divide-gray-200">
            <thead>
                <tr class="text-left text-gray-600 uppercase text-xs">
                    <th class="py-3">Product</th>
                    <th class="py-3">Name</th>
                    <th class="py-3 hidden sm:table-cell">Size</th>
                    <th class="py-3">Price</th>
                    <th class="py-3">Quantity</th>
                    <th class="py-3 hidden sm:table-cell">Subtotal</th>
                    <th class="py-3">Action</th>
                </tr>
            </thead>
            <tbody id="cart-items" class="divide-y divide-gray-100">
                <!-- Cart items will be injected by JS -->
            </tbody>
        </table>
    </div>
    <!-- Cart Totals & Actions -->
    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow p-6 mb-12">
        <div class="flex flex-col gap-4 mb-6">
            <div class="flex justify-between text-lg font-semibold">
                <span>Subtotal</span>
                <span id="cart-subtotal">KES 0</span>
            </div>
            <div class="flex justify-between text-lg">
                <span>Shipping</span>
                <span id="cart-shipping">KES 0</span>
            </div>
            <div class="flex justify-between text-xl font-extrabold border-t pt-4">
                <span>Total</span>
                <span id="cart-total">KES 0</span>
            </div>
        </div>
        <a href="{% url 'checkout' %}"
            class="block w-full bg-[#CA2E0A] text-white text-center font-bold py-3 rounded-full shadow hover:bg-[#a82307] transition text-lg mb-3">Proceed
            to Checkout</a>
        <a href="{% url 'home' %}" class="block w-full text-center text-[#CA2E0A] font-bold hover:underline">&larr;
            Continue
            Shopping</a>
    </div>
</main>
<script src="{% static 'js/mains.js' %}"></script>
{% endblock content %}
