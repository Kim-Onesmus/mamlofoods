{% extends 'ecom_base.html' %}
{% load static %}

{% block content %}
<main>
    <!-- Hero Swiper Section -->
    <section class="relative bg-[#CA2E0A] text-white">
        <div class="container mx-auto px-0 md:px-4 py-8 md:py-16">
            <div class="swiper heroSwiper">
                <div class="swiper-wrapper" id="hero-swiper-wrapper">
                    <!-- Slides will be injected by JS -->
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>
    </section>

    <!-- Product Cards Section -->
    <section id="products" class="bg-gray-50 py-12">
        <div class="container mx-auto px-4">
            <div id="product-cards" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- Product cards will be injected here by JS -->
            </div>
        </div>
    </section>
</main>
<script src="{% static 'js/mains.js' %}"></script>
{% endblock content %}
