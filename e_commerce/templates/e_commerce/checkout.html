{% extends 'ecom_base.html' %}
{% load static %}

{% block content %}
<main class="container mx-auto px-4 py-4">
    <!-- Breadcrumb Card -->
    <div class="bg-white rounded-xl shadow p-4 mb-8">
        <nav class="flex items-center text-gray-600 text-sm" aria-label="Breadcrumb">
            <a href="{% url 'home' %}" class="hover:text-[#CA2E0A] font-semibold">Home</a>
            <span class="mx-2">/</span>
            <a href="{% url 'cart' %}" class="hover:text-[#CA2E0A] font-semibold">Cart</a>
            <span class="mx-2">/</span>
            <span class="text-[#CA2E0A] font-bold">Checkout</span>
        </nav>
    </div>
    <form class="flex flex-col lg:flex-row gap-12" id="checkout-form">
        <!-- Checkout Form (Shipping Details) -->
        <div class="flex-1 bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-8 lg:mb-0">
            <h2 class="text-xl font-bold mb-6 text-[#CA2E0A]">Shipping Details</h2>
            <div class="mb-4">
                <label for="name" class="block text-gray-700 font-semibold mb-1">Full Name</label>
                <input id="name" name="name" type="text"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    value="{{ request.user.get_full_name }}" required>
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-semibold mb-1">Email</label>
                <input id="email" name="email" type="email"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A] bg-gray-50"
                    value="{{ request.user.email }}" readonly required>
            </div>
            <div class="mb-4">
                <label for="phone" class="block text-gray-700 font-semibold mb-1">Phone</label>
                <input id="phone" name="phone" type="tel"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    value="{{ request.user.phone_number }}" required>
            </div>
            <div class="mb-4">
                <label for="shipping-address" class="block text-gray-700 font-semibold mb-1">Shipping Address</label>
                <div class="flex gap-2 items-center">
                    <select id="shipping-address" name="shipping-address"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]">
                        <option class="text-gray-500" value="">Select shipping address</option>
                        <!-- User addresses will be inserted here by checkout.js -->
                        <option value="Tom Mboya Estate, Kisumu, Kenya">Tom Mboya Estate, Kisumu, Kenya</option>
                        <option value="Amagoro Micro factory, Malaba, Kenya">Amagoro Micro factory, Malaba, Kenya
                        </option>
                        <option value="Kimathi Street, Pioneer House, 4th Floor, Room no 7">
                            Kimathi Street, Pioneer House, 4th Floor, Room no 7
                        </option>
                    </select>
                    <!-- <button type="button" id="add-address-btn"
                        class="bg-[#CA2E0A] text-white px-3 py-2 rounded shadow hover:bg-[#a82307] transition text-sm font-bold">Add
                        New</button> -->
                </div>
            </div>
        </div>
        <!-- Order Summary -->
        <div class="flex-1 max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8 flex flex-col">
            <h2 class="text-xl font-bold mb-6 text-[#CA2E0A]">Order Summary</h2>
            <div class="divide-y divide-gray-100 mb-6" id="checkout-items">
                <!-- Cart items will be injected here by JS -->
            </div>
            <div class="flex flex-col gap-4 mb-6">
                <div class="flex justify-between text-lg font-semibold">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">KES 0</span>
                </div>
                <div class="flex justify-between text-lg">
                    <span>Shipping Fee</span>
                    <span id="checkout-shipping">KES 0</span>
                </div>
                <div class="flex justify-between text-xl font-extrabold border-t pt-4">
                    <span>Total</span>
                    <span id="checkout-total">KES 0</span>
                </div>
            </div>
            <!-- Payment Method: Only M-Pesa -->
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-1">Payment Method</label>
                <div class="flex gap-4 mb-2">
                    <label class="flex items-center gap-2">
                        <input type="radio" name="payment" value="mpesa" class="accent-[#CA2E0A]" checked>
                        <span>M-Pesa</span>
                    </label>
                </div>
                <label for="mpesa-phone" class="block text-gray-700 font-semibold mb-1">M-Pesa Phone Number</label>
                <input id="mpesa-phone" name="mpesa-phone" type="tel" pattern="[0-9]{10,13}" maxlength="13"
                    placeholder="e.g. 07XXXXXXXX" required
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]">
            </div>
            <button type="submit" id="checkout-btn"
                class="w-full bg-[#CA2E0A] text-white font-bold py-3 rounded-full shadow hover:bg-[#a82307] transition text-lg">Place
                Order</button>
        </div>
    </form>

    <!-- Modal for adding new address (moved outside the form) -->
    <div id="address-modal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md relative">
            <button id="close-modal"
                class="absolute top-2 right-2 text-gray-400 hover:text-[#CA2E0A] text-2xl">&times;</button>
            <h3 class="text-xl font-bold mb-4 text-[#CA2E0A]">Add New Shipping Address</h3>
            <!-- The inputs inside here no longer block the main form -->
            <div class="mb-3">
                <label class="block text-gray-700 font-semibold mb-1">County</label>
                <input id="modal-county" type="text"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    required>
            </div>
            <div class="mb-3">
                <label class="block text-gray-700 font-semibold mb-1">Subcounty</label>
                <input id="modal-subcounty" type="text"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    required>
            </div>
            <div class="mb-3">
                <label class="block text-gray-700 font-semibold mb-1">Town</label>
                <input id="modal-town" type="text"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    required>
            </div>
            <div class="mb-3">
                <label class="block text-gray-700 font-semibold mb-1">Address Line 1</label>
                <input id="modal-line1" type="text"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]"
                    required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-1">Address Line 2</label>
                <input id="modal-line2" type="text"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#CA2E0A]">
            </div>
            <button id="save-address" type="button"
                class="w-full bg-[#CA2E0A] text-white font-bold py-2 rounded-full shadow hover:bg-[#a82307] transition">Add
                Address</button>
        </div>
    </div>
</main>

<!-- Checkout Modal -->
<div id="checkout-modal" style="display:none;"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-[#CA2E0A]">Checkout</h2>
            <button id="checkout-modal-close" class="text-gray-400 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <p id="checkout-modal-message" class="mb-6 text-gray-700"></p>
        <div class="flex justify-end">
            <button id="checkout-modal-close2"
                class="px-4 py-2 rounded bg-[#CA2E0A] text-white font-bold">Close</button>
        </div>
    </div>
</div>

<!-- Order Modal -->
<div id="order-modal" style="display:none;"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-[#CA2E0A]">Order Status</h2>
            <button id="order-modal-close" class="text-gray-400 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <div id="order-modal-content" class="mb-6 text-gray-700"></div>
        <div class="flex justify-end">
            <button id="order-modal-close2" class="px-4 py-2 rounded bg-[#CA2E0A] text-white font-bold">Close</button>
        </div>
    </div>
</div>

<script src="{% static 'js/checkout.js' %}"></script>
{% endblock content %}
